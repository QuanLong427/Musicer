services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
      - backend/.env.local
    environment:
      - MUSIC_DIR=/music
    volumes:
      - ${MUSIC_DIR:-~/Documents/bili}:/music
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
